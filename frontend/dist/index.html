<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/beancount.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>Beancount Bot</title>
  <script type="module" crossorigin src="/assets/index-B-IHTpqW.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-BgdYbmp3.css">
<link rel="manifest" href="/manifest.webmanifest"></head>
<body class="bg-gray-100">
  <div id="app" class="flex flex-col h-dvh max-w-4xl mx-auto shadow-lg rounded-lg overflow-hidden">
    <!-- 选项卡导航 -->
    <div class="flex-grow-0 flex-shrink-0 bg-white border-b border-gray-200 shadow-sm">
        <div class="flex">
            <button data-tab-button="history" class="flex-1 py-3 px-4 bg-blue-500 text-white font-medium flex items-center justify-center gap-2">
                <i class="fas fa-history text-sm"></i> <span data-i18n="history">History</span>
            </button>
            <button data-tab-button="favorites" class="flex-1 py-3 px-4 bg-gray-100 text-gray-600 font-medium flex items-center justify-center gap-2">
                <i class="fas fa-star text-sm"></i> <span data-i18n="favourites">Favourites</span>
            </button>
        </div>
    </div>

    <!-- 历史记录 -->
    <div id="message-history" data-tab="history" class="flex-1 overflow-y-auto bg-gray-50">
        <div class="flex flex-col items-center p-4 space-y-4"></div>
    </div>
    <!-- 收藏夹 -->
    <div id="message-favorites" data-tab="favorites" class="flex-1 hidden overflow-y-auto bg-gray-50">
        <div class="flex flex-col items-center p-4 space-y-4"></div>
    </div>

    <!-- 底部输入栏 -->
    <div class="flex-grow-0 flex-shrink-0 bg-white border-t border-gray-200 shadow-sm">
        <div class="container max-w-4xl mx-auto px-4 py-4">
            <!-- 生成结果预览 -->
            <div id="transaction-dialog" class="hidden mb-4 border rounded-lg p-4 bg-white shadow-md">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="font-medium text-gray-700" data-i18n="transaction_preview">Transaction Preview</h3>
                    <button id="close-dialog" class="text-gray-400 hover:text-gray-600">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <pre id="transaction-text" class="text-sm mb-4 p-3 bg-gray-50 rounded border border-gray-200 overflow-x-auto"></pre>
                <div class="flex gap-3">
                    <button id="submit-transaction" class="flex-1 py-2 px-4 bg-blue-500 hover:bg-blue-600 text-white rounded-md font-medium flex items-center justify-center gap-2">
                        <i class="fas fa-check"></i> <span data-i18n="submit">Submit</span>
                    </button>
                    <button id="clone-transaction" class="hidden flex-1 py-2 px-4 bg-blue-500 hover:bg-blue-600 text-white rounded-md font-medium flex items-center justify-center gap-2">
                        <i class="fas fa-copy"></i> <span data-i18n="clone">Clone</span>
                    </button>
                </div>
            </div>

            <!-- 输入表单 -->
            <div class="flex gap-3">
                <div class="flex-1 relative">
                    <input id="message-input" type="text" placeholder="Input your transaction" data-i18n="[placeholder]trx_hint" class="w-full px-4 py-3 pr-10 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent" >
                    <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-gray-400">
                        <i class="fas fa-receipt"></i>
                    </div>
                </div>
                <button id="send-button" class="px-6 py-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600 font-medium flex items-center gap-2">
                    <i class="fas fa-paper-plane"></i> <span data-i18n="submit">Submit</span>
                </button>
            </div>
        </div>
    </div>
  </div>
  <div id="error-dialog" class="hidden fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 max-w-svw p-4 border bg-red-50 border-red-100 rounded shadow-md"></div>
  <div id="loading-indicator" class="hidden fixed top-0 left-0 w-full h-full items-center justify-center bg-gray-500/10 z-50">
    <div class="spinner"></div>
  </div>
</body>
</html>
