<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/beancount.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>Beancount Bot</title>
  <script type="module" crossorigin src="/assets/index-Dc_LTI9V.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-DVH0eH_v.css">
<link rel="manifest" href="/manifest.webmanifest"></head>
<body class="bg-gray-100">
  <div id="app" class="flex flex-col h-dvh max-w-4xl mx-auto shadow-lg rounded-lg overflow-hidden">
    <!-- 选项卡导航 -->
    <div class="flex-grow-0 flex-shrink-0 bg-white border-b border-gray-200 shadow-sm">
        <div class="flex">
            <button data-tab-button="history" class="flex-1 py-3 px-4 bg-blue-500 text-white font-medium flex items-center justify-center gap-2">
                <i class="fas fa-history text-sm"></i> <span data-i18n="history">History</span>
            </button>
            <button data-tab-button="favorites" class="flex-1 py-3 px-4 bg-gray-100 text-gray-600 font-medium flex items-center justify-center gap-2">
                <i class="fas fa-star text-sm"></i> <span data-i18n="favourites">Favourites</span>
            </button>
        </div>
    </div>

    <!-- 历史记录 -->
    <div id="message-history" data-tab="history" class="flex-1 overflow-y-auto bg-gray-50">
        <div class="flex flex-col items-center p-4 space-y-4"></div>
    </div>
    <!-- 收藏夹 -->
    <div id="message-favorites" data-tab="favorites" class="flex-1 hidden overflow-y-auto bg-gray-50">
        <div class="flex flex-col items-center p-4 space-y-4"></div>
    </div>

    <!-- 底部输入栏 -->
    <div class="flex-grow-0 flex-shrink-0 bg-white border-t border-gray-200 shadow-sm">
        <div class="container max-w-4xl mx-auto px-4 py-4">
            <!-- 输入表单 -->
            <div class="flex gap-3">
                <div class="flex-1 relative">
                    <input id="message-input" type="text" placeholder="Input your transaction" data-i18n="[placeholder]trx_hint" class="w-full px-4 py-3 pr-10 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent" >
                    <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-gray-400">
                        <i class="fas fa-receipt"></i>
                    </div>
                </div>
                <button id="send-button" class="px-6 py-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600 font-medium flex items-center gap-2">
                    <i class="fas fa-paper-plane"></i> <span data-i18n="submit">Submit</span>
                </button>
            </div>
        </div>
    </div>
  </div>

  <!-- 遮罩层 -->
  <div id="dialog-overlay" class="hidden fixed inset-0 bg-black/40 z-40 backdrop-blur-sm opacity-0 transition-opacity duration-300"></div>

  <!-- 底部 Sheet -->
  <div id="transaction-dialog" class="hidden fixed bottom-0 left-0 right-0 z-50 bg-white rounded-t-2xl shadow-2xl max-w-4xl mx-auto">
    <div class="flex justify-center pt-3 pb-1 cursor-pointer">
      <div class="w-10 h-1.5 bg-gray-300 rounded-full"></div>
    </div>
    <div class="px-5 pb-6 pt-2">
      <div class="flex justify-between items-center mb-3">
        <h3 class="font-medium text-gray-700" data-i18n="transaction_preview">Transaction Preview</h3>
        <button id="close-dialog" class="text-gray-400 hover:text-gray-600 p-1">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <pre id="transaction-text" class="text-sm mb-4 p-3 bg-gray-50 rounded-lg border border-gray-200 overflow-x-auto"></pre>

      <!-- 数字键盘 -->
      <div id="numpad-container" class="mb-4 hidden">
        <div class="text-sm font-medium text-gray-700 mb-2" data-i18n="modify_amount">修改金额</div>
        <div id="amount-display" class="w-full p-2 mb-3 bg-gray-50 border border-gray-200 rounded text-center font-medium text-lg min-h-[2.875rem]"></div>
        <div class="grid grid-cols-3 gap-2">
          <button class="numpad-btn py-3 bg-gray-100 hover:bg-gray-200 rounded-md font-medium">1</button>
          <button class="numpad-btn py-3 bg-gray-100 hover:bg-gray-200 rounded-md font-medium">2</button>
          <button class="numpad-btn py-3 bg-gray-100 hover:bg-gray-200 rounded-md font-medium">3</button>
          <button class="numpad-btn py-3 bg-gray-100 hover:bg-gray-200 rounded-md font-medium">4</button>
          <button class="numpad-btn py-3 bg-gray-100 hover:bg-gray-200 rounded-md font-medium">5</button>
          <button class="numpad-btn py-3 bg-gray-100 hover:bg-gray-200 rounded-md font-medium">6</button>
          <button class="numpad-btn py-3 bg-gray-100 hover:bg-gray-200 rounded-md font-medium">7</button>
          <button class="numpad-btn py-3 bg-gray-100 hover:bg-gray-200 rounded-md font-medium">8</button>
          <button class="numpad-btn py-3 bg-gray-100 hover:bg-gray-200 rounded-md font-medium">9</button>
          <button class="numpad-btn py-3 bg-gray-100 hover:bg-gray-200 rounded-md font-medium">.</button>
          <button class="numpad-btn py-3 bg-gray-100 hover:bg-gray-200 rounded-md font-medium">0</button>
          <button id="numpad-clear" class="py-3 bg-red-100 hover:bg-red-200 rounded-md font-medium">C</button>
        </div>
      </div>

      <div class="flex gap-3">
        <button id="submit-transaction" class="flex-1 py-2 px-4 bg-blue-500 hover:bg-blue-600 text-white rounded-md font-medium flex items-center justify-center gap-2">
          <i class="fas fa-check"></i> <span data-i18n="submit">Submit</span>
        </button>
        <button id="clone-transaction" class="hidden flex-1 py-2 px-4 bg-blue-500 hover:bg-blue-600 text-white rounded-md font-medium flex items-center justify-center gap-2">
          <i class="fas fa-copy"></i> <span data-i18n="clone">Clone</span>
        </button>
        <button id="modify-amount" class="flex-1 py-2 px-4 bg-blue-500 hover:bg-blue-600 text-white rounded-md font-medium flex items-center justify-center gap-2">
          <i class="fas fa-pen"></i> <span data-i18n="modify_amount">修改金额</span>
        </button>
        <button id="submit-with-amount" class="hidden flex-1 py-2 px-4 bg-green-500 hover:bg-green-600 text-white rounded-md font-medium flex items-center justify-center gap-2">
          <i class="fas fa-check"></i> <span data-i18n="submit_modified">提交修改</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 顶部 Toast -->
  <div id="error-dialog" class="hidden fixed top-4 z-50 max-w-lg w-[90%] px-4 py-3 bg-red-50 border border-red-200 rounded-lg shadow-lg flex items-center gap-3">
    <svg class="w-5 h-5 text-red-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
    </svg>
    <span class="text-red-700 text-sm font-medium flex-1"></span>
  </div>

  <div id="loading-indicator" class="hidden fixed top-0 left-0 w-full h-full items-center justify-center bg-gray-500/10 z-50">
    <div class="spinner"></div>
  </div>
</body>
</html>
